[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-passthrough"
version = "0.1.0"
description = "Unofficial LM Studio-compatible FastAPI proxy with pluggable providers"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LMS Passthrough contributors" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.1",
  "uvicorn[standard]>=0.30.0",
  "sse-starlette>=2.1.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5.0", "mike>=2.1.0"]

[project.scripts]
lms-passthrough = "lms_passthrough.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lms_passthrough"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PL",
  "SIM",
  "UP",
  "W",
]
ignore = ["PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["lms_passthrough"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in live LM Studio conformance suite (requires --live-lms <url>)"]
