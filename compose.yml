services:
  lms-passthrough:
    build: .
    image: lms-passthrough:local
    container_name: lms-passthrough-container
    restart: unless-stopped
    ports:
      - "1234:1234"
    env_file:
      - .env
    volumes:
      - ${DOCKER_CONFIG:-./storage/config/docker-config.yaml}:/app/config.yaml:ro
      - ./storage/state:/app/state
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "lms-passthrough"
      tsdproxy.ephemeral: "true"
